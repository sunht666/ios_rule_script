<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ERPlus 员工在线状态</title>
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <div class="shell">
        <header class="topbar">
            <div>
                <p class="kicker">ERPLUS LIVE MATRIX</p>
                <h1>员工在线状态</h1>
            </div>
            <div class="ops">
                <div class="sync">
                    <span>同步</span>
                    <strong id="syncTime">--:--</strong>
                </div>
                <button id="refreshBtn" class="neon-btn" type="button">刷新</button>
            </div>
        </header>

        <section id="stats" class="stats" aria-label="状态统计"></section>
        <section id="tomorrowPanel" class="tomorrow-panel" aria-label="员工日志"></section>
        <section id="insights" class="insights" aria-label="系统概览"></section>

        <section class="control-rig">
            <label class="search-box">
                <span>检索</span>
                <input id="searchInput" type="search" placeholder="姓名 / 职位 / 部门">
            </label>
            <div id="activeFilter" class="active-filter">过滤：全部员工</div>
        </section>

        <main id="departmentGrid" class="department-grid"></main>
    </div>

    <div id="modalBackdrop" class="modal-backdrop" hidden>
        <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalName">
            <button id="modalClose" class="modal-close" type="button" aria-label="关闭">×</button>
            <div id="modalContent"></div>
        </section>
    </div>

    <div id="toast" class="toast">加载中</div>
    <script src="./app.js?v=20260429-log-card"></script>
</body>
</html>
